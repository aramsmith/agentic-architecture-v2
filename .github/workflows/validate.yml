name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository governance tests
        run: npm run test:governance

      - name: Check generated adoption documentation
        run: npm run docs:check

      - name: Run adoption and release tests
        run: npm run test:adoption

      - name: Run contract tests
        run: npm run test:contracts

      - name: Run secure renderer tests
        run: npm run test:renderer

      - name: Run Contoso harness tests
        run: npm run test:smoke

      - name: Run complete regression suite
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Validate framework
        run: npm run validate -- --framework-only

      - name: Run offline Contoso smoke journey
        run: npm run smoke:contoso
