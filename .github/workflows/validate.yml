name: Validate AFF contracts

on:
  pull_request:
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/workflows/validate.yml"
      - "cases/**"
      - "docs/**"
      - "schemas/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "README.md"
  push:
    branches: [main]
    paths:
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/workflows/validate.yml"
      - "cases/**"
      - "docs/**"
      - "schemas/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run contract tests
        run: npm run test:contracts

      - name: Run secure renderer tests
        run: npm run test:renderer

      - name: Run Contoso harness tests
        run: npm run test:smoke

      - name: Type-check
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Validate framework
        run: npm run validate -- --framework-only

      - name: Run offline Contoso smoke journey
        run: npm run smoke:contoso
